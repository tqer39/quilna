name: Prototype checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow-result:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
      - run: node scripts/check-security.mjs
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run workers:build
      - run: npm run test:workers
      - run: npm exec --no -- playwright install --with-deps chromium
      - name: Record browser validation source
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-sha.txt
      - run: npm run test:browser
      - id: search
        run: npm run test:search-performance
      - name: Preserve browser validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            .local-state/search-performance/results/**/measurements.json
          include-hidden-files: true
          retention-days: 14
      - name: Diagnose a failed search gate
        if: ${{ failure() && steps.search.conclusion == 'failure' }}
        timeout-minutes: 4
        run: node scripts/diagnose-search.mjs
      - name: Preserve search diagnostic traces
        if: ${{ !cancelled() && steps.search.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local-state/search-diagnostics/
          include-hidden-files: true
          retention-days: 14

  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: harness/go.mod
          cache: false
      - name: Install SQLite CLI on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3
      - run: bash scripts/check-harness.sh

  apple:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test --package-path apple --scratch-path .local-state/swift-build
      - run: swift build --package-path apple --scratch-path .local-state/swift-build
      - name: Build iOS Simulator app without signing
        run: >-
          xcodebuild -project apple/Quilna.xcodeproj
          -scheme Quilna-iOS -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .local-state/ios-build
          CODE_SIGNING_ALLOWED=NO build
