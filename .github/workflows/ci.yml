name: Prototype checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: prototype-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.scope.outputs.web }}
      harness: ${{ steps.scope.outputs.harness }}
      apple: ${{ steps.scope.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - id: scope
        run: node scripts/ci-selection.mjs select

  checks:
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
      - run: node scripts/check-security.mjs
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm audit signatures
      - run: npm run lint
      - run: node --test tests/server/ci-selection.test.mjs
      - if: needs.selection.outputs.web == 'true'
        run: npm run typecheck
      - if: needs.selection.outputs.web == 'true'
        run: npm test
      - if: needs.selection.outputs.web == 'true'
        run: npm run build
      - if: needs.selection.outputs.web == 'true'
        run: npm run workers:build
      - if: needs.selection.outputs.web == 'true'
        run: npm run test:workers
      - if: needs.selection.outputs.web == 'true'
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Record browser validation source
        id: browser-source
        if: needs.selection.outputs.web == 'true'
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-sha.txt
      - if: needs.selection.outputs.web == 'true'
        run: npm run test:browser
      - if: needs.selection.outputs.web == 'true'
        run: npm run test:search-performance
      - name: Preserve browser validation evidence
        if: ${{ !cancelled() && needs.selection.outputs.web == 'true' && steps.browser-source.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            .local-state/search-performance/results/**/measurements.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  harness:
    needs: selection
    if: needs.selection.outputs.harness == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: harness/go.mod
          cache: false
      - name: Install SQLite CLI on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sqlite3
      - run: bash scripts/check-harness.sh

  apple:
    needs: selection
    if: needs.selection.outputs.apple == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test --package-path apple --scratch-path .local-state/swift-build
      - run: swift build --package-path apple --scratch-path .local-state/swift-build
      - name: Build iOS Simulator app without signing
        run: >-
          xcodebuild -project apple/Quilna.xcodeproj
          -scheme Quilna-iOS -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .local-state/ios-build
          CODE_SIGNING_ALLOWED=NO build

  workflow-result:
    if: ${{ always() }}
    needs: [selection, checks, harness, apple]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
      - name: Require every selected check
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-selection.mjs check
